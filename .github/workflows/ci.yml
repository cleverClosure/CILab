# CI: сборка и тесты CILab на каждом push/PR.
# Автор: Tim Isaev

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Pin Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Cache SPM checkouts
        uses: actions/cache@v4
        with:
          path: dd/SourcePackages
          key: spm-${{ hashFiles('CILab.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build and test
        run: |
          xcodebuild -workspace CILab.xcworkspace -scheme CILab \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath dd test
