# Демонстрация «чистой машины»: device-сборка без сертификатов
# и профилей на раннере. Ожидаемо падает — лог нужен статье.
# Автор: Tim Isaev

name: Device build demo

on:
  workflow_dispatch:

jobs:
  device-build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Pin Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build for device
        run: |
          xcodebuild -workspace CILab.xcworkspace -scheme CILab \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd build
